# 網頁版部署（選配；正式使用是手機上的離線 APK）。
#   docker compose -f deploy/docker-compose.yml up -d --build
# 對外：http://<server>:18080/assistant/（服務頁在 /，小幫手在 /assistant/）
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "18080:80"
    depends_on:
      - llm
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    # 微調過的 Gemma 3 270M 決策器（只輸出 1 個字母）。原版 Gemma 沒有微調，在這個任務上幾乎是亂猜，不能拿來用。
    # 先把 GitHub Release 的 gemma-3-270m-decider-Q8_0.gguf 放到 tools/llm/out/。
    command: >
      -m /models/gemma-3-270m-decider-Q8_0.gguf
      --host 0.0.0.0 --port 8080
      -c 4096 -np 2 --threads 6
      --cache-reuse 256
    volumes:
      - ../tools/llm/out:/models:ro
    expose:
      - "8080"
    restart: unless-stopped
